[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` enables Window::add_child — multiple webviews in one window, which
# is how the browser shell composes a chrome webview + a content webview. The
# feature is API-unstable (not semver-frozen) but production-used; acceptable for
# a personal browser. See tauri PR #8280.
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-log = "2"

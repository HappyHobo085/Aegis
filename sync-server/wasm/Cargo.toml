# The Aegis sync server as a Meshnode WASM service: a `wasi:http` handler over `meshnode:kv`.
# THE ACTIVE sync server (the axum one in `../legacy-docker` is deprecated). Aegis owns and
# maintains this source; Meshnode no longer keeps a copy. See AGENTS.md.
# Its own workspace; builds for wasm32-wasip2 only.
[workspace]
resolver = "3"

[package]
name = "aegis-sync"
version = "0.1.0"
edition = "2024"
# MUST equal `src-tauri/Cargo.toml` and `../core/Cargo.toml` (checked by the CI `msrv` job).
rust-version = "1.95.0"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The protocol core, WITHOUT its test-only `vectors` feature.
aegis-sync-core = { path = "../core" }
wstd = "0.6"
wit-bindgen = "0.57.1"
# The WASI wall clock and randomness (already a dependency of wstd).
wasip2 = "2"
futures-lite = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# TEST ONLY: lowers the server-wide caps (`src/caps.rs`) so a test harness can reach them with a
# handful of requests (Meshnode's harness used it until 2026-11-22). Every deploy builds without it.
test-caps = []

[profile.release]
opt-level = "s"
debug = false
strip = true

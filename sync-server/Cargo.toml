[package]
name = "aegis-sync-server"
version = "0.1.0"
edition = "2021"
# Mirror the main crate's MSRV so clippy lints consistently across the repo (e.g. it
# won't suggest `is_multiple_of`, stabilized in 1.87, over the existing `% 2`). Kept in
# step with `src-tauri/Cargo.toml`, and the `msrv` job in .github/workflows/ci.yml
# reads BOTH files and fails if they ever disagree — an earlier "1.77.2" here was
# simply wrong about the crate it claimed to mirror, and no job pinned either value.
# 1.80.0 was then wrong too, and so was the 1.85.0 that replaced it: the msrv job had
# never actually compiled the declared floor (see src-tauri/Cargo.toml for why).
# 1.88.0 is the shared value, which is ABOVE this crate's own dependency floor of
# 1.85.0 — deliberately, because the job enforces equality and the two crates ship and
# are gated together. A lower number here would just be a number the job rejects.
rust-version = "1.88.0"
description = "Reference self-hosted sync server for Aegis — stores opaque ciphertext only."
license = "AGPL-3.0-only"
publish = false

# Standalone (NOT a workspace member of the Tauri app) so it builds/deploys independently.

[dependencies]
axum = "0.8"
# `sync` + `time` are for the pre-extractor admission guard (`Limits`): tokio::sync::Semaphore
# bounds how many request bodies can be buffered at once and tokio::time::timeout bounds how long
# one may take. Features are NOT recorded in Cargo.lock, so enabling them keeps `cargo --locked`
# green — unlike adding a whole new crate, which would require regenerating the lockfile.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the verification half of the auth scheme — the server never signs.
ed25519-dalek = "2"

# Release profile: strip symbols + LTO so the deployed/Docker binary is lean (the plain
# `cargo build --release` was shipping an unstripped ~2.3 MB binary). panic=unwind is kept
# deliberately — this is a server with no JNI/catch_unwind contract, and a panicking request
# handler must fail only its own task, never abort the whole process (panic=abort would).
[profile.release]
strip = true
lto = true
codegen-units = 1

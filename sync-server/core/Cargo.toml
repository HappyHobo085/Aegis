[package]
name = "aegis-sync-core"
version = "0.1.0"
edition = "2021"
# MUST equal `src-tauri/Cargo.toml` and `sync-server/wasm/Cargo.toml`: the `msrv` job in
# .github/workflows/ci.yml reads all three manifests and fails if they disagree.
rust-version = "1.95.0"
description = "Pure protocol core of the Aegis sync server: auth, wire shapes and bounds, no I/O."
license = "AGPL-3.0-only"
publish = false

# PURE: no axum, no tokio, no OS clock or randomness. Anything that needs the time or entropy takes
# the `env::Clock` / `env::Entropy` traits, so the same code runs natively (the deprecated axum
# server in `../legacy-docker`) and as the WASM service in `../wasm` (the active server).
#
# Its OWN workspace with its own Cargo.lock, so it is gated without either server: the legacy server
# is out of CI, and the WASM service only builds for wasm32-wasip2. Both servers path-depend on it.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verification only — the server never signs.
ed25519-dalek = "3"

[features]
# Test-only: exposes `canon::CONTENT_PASSES`, the per-thread count of full passes over a record's
# content, so the SERVER's tests can pin that a synthesized id reads the ciphertext once. Enabled
# only by the server's `[dev-dependencies]` entry; never part of a release build.
test-instrument = []
# Test-only: the contract-vector types and `vector::load_all` (`src/vector.rs`), plus the signing
# helpers that expand the vectors' templates. Enabled only by test code: this crate's own
# `[dev-dependencies]` self-entry below (for `tests/vectors.rs`) and the server's
# `[dev-dependencies]`. Release and WASM builds never contain it.
vectors = []

[dev-dependencies]
# This crate with its `vectors` feature, so `cargo test -p aegis-sync-core` builds
# `tests/vectors.rs` without anyone having to remember `--features vectors`. A dev-dependency
# never reaches a normal build (resolver 2).
aegis-sync-core = { path = ".", features = ["vectors"] }

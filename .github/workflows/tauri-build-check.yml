name: Tauri Build Check

# Verification-only: build Aegis (Tauri) on real Windows, macOS, and Linux runners to
# confirm it compiles + links on each OS. No bundling, signing, or release — that's
# tauri-release.yml on a version tag. Added so the Windows/macOS builds (which can't be
# run from the Linux dev machine) get verified on actual hardware. Runs on pushes to the
# migration branch and on demand.
on:
  push:
    branches:
      - 'feat/tauri-migration'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build links webkit2gtk; install the apt equivalents of the Fedora
      # deps used in dev (mirrors tauri-release.yml).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-buildcheck-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # Unit tests are JS/Rust and platform-agnostic, but running them here confirms the
      # toolchain is sane on each OS before the heavier compile.
      - run: npm test

      # Build the renderer + the Tauri app WITH installers (release). Unsigned — no
      # signing key needed and no release is published; the installers are uploaded as
      # CI artifacts you download from the Actions run page and run, for on-device
      # runtime testing of Windows/macOS. (APPIMAGE_EXTRACT_AND_RUN handles the Linux
      # AppImage FUSE quirk; both env vars are ignored on Windows/macOS.)
      - name: Build installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: npm run tauri -- build

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

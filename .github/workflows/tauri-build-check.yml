name: Tauri Build Check

# Build Aegis (Tauri) on real Windows, macOS, and Linux runners + a debug Android APK,
# to confirm it compiles/links on each OS and to produce runnable artifacts you can
# download from the Actions run page for on-device testing:
#   - aegis-linux-appimage   : portable .AppImage (any distro, incl. Fedora)
#   - aegis-linux-rpm         : .rpm package (Fedora / RHEL / openSUSE)
#   - aegis-windows-portable : portable, self-contained Aegis_x64_portable.exe
#   - aegis-macos            : .app + .dmg
#   - aegis-android-apk      : installable debug APK
# No signing / release — that's tauri-release.yml on a version tag. Runs on demand
# (workflow_dispatch) only — no auto-run on push to main; trigger it from the
# Actions tab ("Run workflow") when you want fresh cross-OS build artifacts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: a PORTABLE, self-contained .exe — the raw release binary (it needs
          # only the system WebView2 runtime, present on Win10/11). --no-bundle skips the
          # NSIS installer; we ship the portable exe instead.
          - platform: windows-latest
            artifact: aegis-windows-portable
            bundles: '--no-bundle'
            artifact_path: src-tauri/target/release/Aegis_x64_portable.exe
          # macOS: the default .app + .dmg bundles.
          - platform: macos-latest
            artifact: aegis-macos
            bundles: ''
            artifact_path: src-tauri/target/release/bundle/**
          # Linux: the portable AppImage + the .rpm package. --bundles overrides the
          # config's target list. Built on ubuntu-24.04 (NOT 22.04): 22.04's webkit2gtk
          # is built with _GLIBCXX_ASSERTIONS and hits a libstdc++ abort in Skia's COLR-v1
          # color-font path, so the bundled-webkit AppImage crashed (blank/frozen pages)
          # on newer distros like Fedora; 24.04's newer webkit avoids it. (glibc floor
          # rises to 2.39 — fine for current distros.)
          # bundleMediaFramework (via --config) ships GStreamer plugins matched to the
          # bundled libgstreamer, so HTML5 <video>/streams play on other distros — without
          # it the bundled (ubuntu) libgstreamer can't load the host's (e.g. Fedora) plugins
          # and playback fails/crashes. It's CI-only: linuxdeploy's gstreamer plugin is
          # Debian-pathed and fails on a Fedora dev box, so the main config leaves it off.
          - platform: ubuntu-24.04
            artifact: aegis-linux-appimage
            bundles: '--bundles appimage --config src-tauri/tauri.appimage-mediaframework.conf.json'
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: ubuntu-24.04
            artifact: aegis-linux-rpm
            bundles: '--bundles rpm'
            artifact_path: src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build links webkit2gtk; install the apt equivalents of the Fedora
      # deps used in dev (mirrors tauri-release.yml). The gstreamer1.0-* codec packages
      # are needed at BUILD time so bundleMediaFramework can bundle the decoders/sinks
      # (libav = H.264/AAC, good/bad/ugly = demuxers/sinks/hls) — without them the
      # AppImage demuxes but can't decode, so <video>/streams error out.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            rpm \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-buildcheck-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # Unit tests are JS/Rust and platform-agnostic, but running them here confirms the
      # toolchain is sane on each OS before the heavier compile.
      - run: npm test

      # Build the renderer + the Tauri app (release). Unsigned, no release published.
      # (APPIMAGE_EXTRACT_AND_RUN handles the Linux AppImage FUSE quirk; both env vars
      # are ignored on Windows/macOS.) matrix.bundles is '--no-bundle' on Windows (we
      # ship the raw exe), '--bundles appimage'/'--bundles rpm' on Linux, and empty on
      # macOS (defaults).
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build ${{ matrix.bundles }}

      # Windows: the portable build is the raw release binary. The bundler doesn't emit
      # it under a friendly name, so stage a copy for the artifact.
      - name: Stage portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/app.exe -Destination src-tauri/target/release/Aegis_x64_portable.exe

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android targets for the Rust core (it compiles to a per-ABI cdylib bundled in
      # the APK).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-buildcheck-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # Build a RELEASE APK (minified, not debuggable). build.gradle.kts signs it with
      # the debug key when no keystore.properties is present, so it still installs on any
      # device with "install unknown apps" enabled (no release key needed). NOTE: each CI
      # runner generates its own debug key, so two CI APKs can't update each other — fine
      # for a one-off install/test; a stable channel comes from tauri-release.yml on a tag.
      # The Android SDK + NDK are preinstalled on the runner; point Tauri at the latest NDK.
      - name: Build release APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $NDK_HOME"
          npm run tauri -- android build --apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

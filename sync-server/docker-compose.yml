services:
  sync:
    build: .
    image: aegis-sync-server
    restart: unless-stopped
    ports:
      # Loopback by DEFAULT. The container has no TLS listener of its own and its
      # transport-level auth is nil (the Ed25519 AegisSig token is application-level),
      # so publishing 8787 on every interface hands an unencrypted, unauthenticated-
      # at-the-transport sync endpoint to the whole network. Reaching it from another
      # host therefore needs a TLS reverse proxy in front of it — and once you have
      # one, bind the port to the proxy's address rather than 0.0.0.0 (see DOCKER.md).
      # To publish deliberately: AEGIS_SYNC_BIND=0.0.0.0 docker compose up -d
      - "${AEGIS_SYNC_BIND:-127.0.0.1}:${AEGIS_SYNC_PORT:-8787}:8787"
    environment:
      # AEGIS_SYNC_ADDR=0.0.0.0:8787
      # Binding the LISTENER to 0.0.0.0 inside the container is required regardless of
      # the host-side mapping above: Docker's port publishing reaches the container
      # over its bridge IP, so a 127.0.0.1 listener would be unreachable even when the
      # mapping is wide. The two are independent — this one is not the exposure.
      - AEGIS_SYNC_ADDR=0.0.0.0:8787
      - AEGIS_SYNC_DATA=/data/aegis-sync.json
    volumes:
      - aegis-sync-data:/data
    # The `ip` clause is load-bearing, not decoration. The bare `/healthz` probe
    # runs INSIDE the container against loopback, and a container whose endpoint
    # setup failed has only `lo` — so it answers /healthz perfectly while nothing
    # outside can reach it. Measured on this host: `docker ps` reported `healthy`
    # with `NetworkSettings.Networks={}` and every host-side curl refused. Docker
    # reports such a container as running-and-healthy, so the healthcheck is the
    # only signal that can distinguish "serving" from "isolated"; without this
    # clause a failed restore is indistinguishable from a healthy server.
    #
    # `scope global` is what excludes loopback (`lo` is `scope host`). The exit
    # status of `ip` itself is 0 either way, so the discriminator is `grep -q .`
    # finding a line, not `ip`'s status.
    healthcheck:
      test:
        - CMD-SHELL
        - ip -o -4 addr show scope global | grep -q . && wget -qO- http://127.0.0.1:8787/healthz >/dev/null
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  aegis-sync-data:

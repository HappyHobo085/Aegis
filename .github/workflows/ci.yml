name: CI

# Unit-test gate + supply-chain checks. Runs on every PR (so Dependabot's
# grouped update PRs are gated), on push to main, and weekly (to catch
# dependency-audit / Electron-currency drift even without a PR). The e2e suite
# is intentionally NOT run here — it needs Electron + a virtual display and stays
# the local pre-merge gate.
on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Supersede an in-flight run when a PR branch is re-pushed (e.g. Dependabot
# re-syncing a grouped update) so redundant jobs don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (node + jsdom)
        # `pretest` rebuilds better-sqlite3 for the NODE ABI (not the Electron
        # ABI) — a prebuilt exists for Node 22, with the ubuntu toolchain as
        # fallback; this is unrelated to the Electron-ABI build in build-windows.yml.
        run: npm test
      - name: Dependency audit gate (high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/check-npm-audit.mjs
      - name: Electron security-currency check
        if: ${{ !cancelled() }}
        run: node scripts/check-electron-current.mjs

version: 2

# Supply-chain currency. Grouped minor/patch npm PRs reduce noise; the CI
# workflow (.github/workflows/ci.yml) gates every PR with the unit suite + an
# npm-audit check (high/critical advisories block merge unless allowlisted).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

name: CI

# Unit-test gate + supply-chain checks. Runs on every PR (so Dependabot's
# grouped update PRs are gated), on every push to `main` (so a direct push —
# not just a PR — is gated by clippy/fmt/tests/audit), weekly (to catch
# dependency-audit drift even without a PR), plus on demand.
#
# Five jobs: `web` (typecheck/lint/format/tests/size/npm-audit/version),
# `rust` (src-tauri fmt/clippy/test/audit), `sync-server` (same for the
# standalone service), `cross-target` (compile-only for the Windows/Android/macOS
# cfg surfaces that no other job can see), and `msrv` (proves the declared
# rust-version is a real lower bound).
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Supersede an in-flight run when a PR branch is re-pushed (e.g. Dependabot
# re-syncing a grouped update) so redundant jobs don't pile up.
#
# `github.event_name` is PART OF THE GROUP, and it has to be. `github.ref` alone
# is `refs/heads/main` for BOTH `push: main` and the weekly `schedule`, so a push
# landing while the scheduled dependency audit was running cancelled it — the one
# run that exists to catch a vulnerability nobody opened a PR for. Superseding
# still works where it should: two runs of the same event on the same ref (a PR
# re-push) share a group, and each is superseded by the next.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Node gate: type-check (scoped), lint, format, unit tests, supply-chain audit.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The Android versionCode gate and the coverage ratchets all compare
          # against an EARLIER commit, so they need the history, not just the single
          # checked-out commit: at depth 1 the base commit is not in the clone and
          # every one of those comparisons is skipped.
          fetch-depth: 0

      # The base ref for the gates that compare this commit against an EARLIER
      # one: `coverage-ratchet.mjs` / `rust-coverage-ratchet.mjs` ("was the
      # baseline lowered in this commit?") and `check-android-versioncode.mjs`
      # ("did the versionCode go backwards?"). In a CI worktree the checkout IS
      # the commit under test, so `git show HEAD:<file>` returned the very file
      # being checked and both gates compared a file with itself — the
      # versionCode gate then printed "unchanged from origin/main" and passed on
      # every push to main and on every weekly run, so a DECREASED versionCode
      # (which Android refuses to install) was only ever caught by a PR. The base
      # is therefore the event's own predecessor: the PR's base sha, or `before`
      # on a push.
      #
      # The ref is VERIFIED here, in this step, before it is exported, so a base
      # commit this clone does not hold (a shallow checkout, or a ref the fetch
      # did not cover) degrades to a visible warning here instead of a silent
      # self-comparison inside the gate. `before` is 40 zeroes for a branch's
      # first push, which is not a commit, so that value is excluded explicitly.
      # `schedule` and `workflow_dispatch` have no `before` at all: the gates then
      # skip those two comparisons loudly and the push run covers the commit.
      - name: Resolve the base ref for the comparison gates
        run: |
          REF=''
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF='${{ github.event.pull_request.base.sha }}'
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            REF='${{ github.event.before }}'
          fi
          if [ -n "$REF" ] && git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "AEGIS_BASE_REF=$REF" >> "$GITHUB_ENV"
            echo "AEGIS_BASE_REF=$REF (derived from the ${{ github.event_name }} event)"
          else
            echo "::warning::No base commit available for ${{ github.event_name }} — the coverage-baseline-lowering and Android versionCode comparisons will SKIP loudly."
            echo "  (event.before='${{ github.event.before }}' pull_request.base.sha='${{ github.event.pull_request.base.sha }}')"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (whole surface, tests included)
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Prettier (format check)
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Unit tests (node + jsdom)
        if: ${{ !cancelled() }}
        # `--coverage` rides on THIS step rather than a second `vitest run` in the
        # step below. It is the same suite plus the v8 report, so the job does not
        # pay to transform and run 1500+ tests twice; the ratchet is a separate
        # step anyway so a coverage regression is its own log line and a red suite
        # cannot mask it.
        run: npm run test:coverage
      # The renderer half of the coverage gate. This is a RATCHET, not a
      # threshold — it fails if any metric drops below `coverage-baseline.json`,
      # if the baseline was LOWERED in the same commit (raise freely; lower only
      # with COVERAGE_ALLOW_BASELINE_LOWER=1 and an explanation), or if a file the
      # baseline names stopped being measured — the last one is what stops an
      # added `coverage.exclude` from buying a green build by shrinking the
      # denominator. `COVERAGE_ALLOW_BASELINE_LOWER` is deliberately NOT set here:
      # an owner decision should be visible in the diff.
      - name: Coverage ratchet
        if: ${{ !cancelled() }}
        run: npm run coverage:ratchet
      - name: Build renderer (Vite)
        if: ${{ !cancelled() }}
        run: npm run build:renderer
      - name: Check bundle size
        if: ${{ !cancelled() }}
        # One implementation, shared with `npm run sizecheck` — the inline shell this
        # replaces only emitted `::warning::` and fell through, so it could never fail
        # and a 5x bundle regression was green. The script exits 1 past the budget.
        run: npm run sizecheck
      - name: Dependency audit gate (high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/check-npm-audit.mjs
      - name: Android versionCode monotonicity
        if: ${{ !cancelled() }}
        # The Android versionCode is DERIVED from src-tauri/tauri.conf.json's `version`
        # (tauri.properties itself is autogenerated + git-ignored), so that is what is
        # compared here — a version change must strictly increase it, or Android
        # silently refuses the install as a downgrade.
        run: node scripts/check-android-versioncode.mjs

  # Rust gate for the src-tauri crate: format, lint, the unit tests, supply-chain audit.
  # Every cargo invocation here passes `--locked`, so the committed Cargo.lock is
  # enforced: without it cargo silently re-resolves whenever manifest and lock disagree,
  # and SECURITY.md's "Rust dependencies are pinned via src-tauri/Cargo.lock" is not
  # true. (`cargo fmt` is the one exception — cargo-fmt has no --locked.)
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The Rust coverage ratchet compares the committed baseline against the
          # version at this commit's BASE, so the base commit has to be in the
          # clone. Without this the lookup fails and the comparison is skipped.
          fetch-depth: 0

      # The base ref for the gates that compare this commit against an EARLIER
      # one: `coverage-ratchet.mjs` / `rust-coverage-ratchet.mjs` ("was the
      # baseline lowered in this commit?") and `check-android-versioncode.mjs`
      # ("did the versionCode go backwards?"). In a CI worktree the checkout IS
      # the commit under test, so `git show HEAD:<file>` returned the very file
      # being checked and both gates compared a file with itself — the
      # versionCode gate then printed "unchanged from origin/main" and passed on
      # every push to main and on every weekly run, so a DECREASED versionCode
      # (which Android refuses to install) was only ever caught by a PR. The base
      # is therefore the event's own predecessor: the PR's base sha, or `before`
      # on a push.
      #
      # The ref is VERIFIED here, in this step, before it is exported, so a base
      # commit this clone does not hold (a shallow checkout, or a ref the fetch
      # did not cover) degrades to a visible warning here instead of a silent
      # self-comparison inside the gate. `before` is 40 zeroes for a branch's
      # first push, which is not a commit, so that value is excluded explicitly.
      # `schedule` and `workflow_dispatch` have no `before` at all: the gates then
      # skip those two comparisons loudly and the push run covers the commit.
      - name: Resolve the base ref for the comparison gates
        run: |
          REF=''
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF='${{ github.event.pull_request.base.sha }}'
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            REF='${{ github.event.before }}'
          fi
          if [ -n "$REF" ] && git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "AEGIS_BASE_REF=$REF" >> "$GITHUB_ENV"
            echo "AEGIS_BASE_REF=$REF (derived from the ${{ github.event_name }} event)"
          else
            echo "::warning::No base commit available for ${{ github.event_name }} — the coverage-baseline-lowering and Android versionCode comparisons will SKIP loudly."
            echo "  (event.before='${{ github.event.before }}' pull_request.base.sha='${{ github.event.pull_request.base.sha }}')"
          fi
      # src-tauri links webkit2gtk on Linux; cargo test/clippy compile the crate, so the
      # native build deps must be present (mirrors tauri-build-check.yml's Linux deps).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      # Toolchain comes from rust-toolchain.toml at the repo root. Omitting `toolchain:`
      # makes this action run `rustup show active-toolchain` against the checkout, so
      # the pinned file IS the CI toolchain and the two cannot drift. This replaces
      # `dtolnay/rust-toolchain@stable`, which floated to whatever "stable" meant that
      # morning — a new stable clippy lint turned the build red with no code change and
      # nothing recorded which compiler produced the artifact. `cache: 'false'` because
      # the explicit actions/cache step below already owns caching.
      #
      # A fresh runner does not have the pinned toolchain, and the action resolves it by
      # running `rustup show active-toolchain` against the checkout. Under the
      # rust-toolchain.toml directory override that AUTO-installs the missing toolchain
      # and prints:
      #   warn: the missing active toolchain `1.98.0-…` has been auto-installed
      #   warn: auto-installation is deprecated for most `rustup` commands
      #   warn: scripts relying on this behavior in `rustup` may stop working in the future
      # (rust-lang/rustup#4836). That is a latent CI break, not cosmetic: when the
      # behaviour goes away these jobs stop resolving a compiler at all. Installing the
      # toolchain explicitly first is rustup's own documented remedy ("to install the
      # active toolchain, use `rustup install` instead") and leaves the action's resolve
      # step with nothing to auto-install. The NO-ARG form installs "the active
      # toolchain", i.e. whatever rust-toolchain.toml pins, so this stays the only place
      # the version is written — adding a literal here would reintroduce the drift this
      # file exists to prevent. A no-op once installed, so it costs nothing on re-runs.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache: 'false'
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (-D warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        # Wrapped in `dbus-run-session` + `gnome-keyring-daemon` on purpose, and
        # NOT because the tests need a desktop. Four `sync_keystore` tests
        # round-trip a real OS keychain through `keyring_available()`; with no
        # keyring they early-RETURN, so they pass while covering nothing. A dev
        # box with a desktop session has a keyring and this runner does not, so
        # without this the Rust coverage baseline would be measurable only on
        # some machines — the exact "a threshold satisfiable only on a dev box"
        # failure the coverage ratchet must not have. `unlock` never happens: the
        # default collection is unlocked by the daemon itself.
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          '
      # The Rust half of the coverage gate, same ratchet as the `web` job and the
      # same shared comparison logic. It is a SEPARATE cargo invocation from
      # `cargo test` because `--json` needs a fresh instrumented build (llvm
      # `-C instrument-coverage` is a codegen flag, so it cannot be reused from
      # the plain test artifacts) — which is also why it is a later step, and why
      # it costs minutes rather than seconds. `--lib` is the only target: `main.rs`
      # calls `run()` and launching the app is not a test. The committed exclusion
      # list lives in scripts/rustCoverageCheck.mjs and is printed with each file's
      # real numbers on every run.
      #
      # `--manifest-path` is REQUIRED, not stylistic: this step runs from the repo
      # root, which has no `Cargo.toml` (the crate is `src-tauri/`), and
      # `cargo llvm-cov` shells out to `cargo locate-project` to find the workspace
      # — so without it this fails with `could not find Cargo.toml`, which is
      # exactly how it failed the first time (run 36322944144). Every other cargo
      # step in this job already passes `--manifest-path` for the same reason.
      #
      # The `node` line below deliberately stays at the repo root rather than moving
      # into `src-tauri/`: `rust-coverage-ratchet.mjs` resolves the repo root from
      # `import.meta.url`, not the CWD, and the `filename`s in the JSON are ABSOLUTE
      # paths that it rewrites to repo-relative — so the output is identical either
      # way. Verified: the `--manifest-path` run produces a byte-identical
      # `data[0].files[].filename` set to a `cd src-tauri` run.
      - name: Rust coverage ratchet
        if: ${{ !cancelled() }}
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          # `--manifest-path` is REQUIRED: this step runs from the repo root, which has
          # no `Cargo.toml` (the crate is `src-tauri/`), and `cargo llvm-cov` shells out
          # to `cargo locate-project` to find the workspace. Every other cargo step in
          # this job already passes it.
          #
          # DELIBERATELY NOT WRAPPED in `dbus-run-session` + a keyring, unlike the
          # `cargo test` step above. That asymmetry looks wrong and is the point: the
          # three keychain round-trips in `sync_keystore.rs` share one OS keyring, so
          # their covered-line footprint depends on credential state left by earlier
          # runs. Measured across four runs: 286, 289, 300, and — with no keyring at
          # all — 228 covered lines in that one file. A committed threshold has to be
          # reproducible in EVERY environment, so the baseline in
          # `src-tauri/coverage-baseline.json` is the NO-keyring FLOOR. An environment
          # with a usable keyring only ever covers MORE and so passes; CI without one
          # lands exactly on the floor. Wrapping this step to try to match `cargo test`
          # was tried and abandoned (runs 36325245069 and 36326730887): it did not make
          # the keyring usable for the test run, and the number was unstable anyway.
          # The keyring still matters for `cargo test`, where it decides whether those
          # tests run or skip — that is test quality, not the coverage gate.
          #
          # Regenerating the baseline? Reproduce this environment FIRST:
          #   env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR cargo llvm-cov ...
          # (unsetting only the first is not enough — dbus falls back to
          # $XDG_RUNTIME_DIR/bus). A box can serve a secret service with no
          # gnome-keyring-daemon installed at all. Getting this wrong broke run
          # 36440444084 on `sync.rs` (-82) and `sync_keystore.rs` (-58); see
          # "The Rust coverage baseline is a FLOOR" in src-tauri/AGENTS.md.
          #
          # That recipe is NECESSARY BUT NOT SUFFICIENT, and the second half of the
          # problem is not about D-Bus at all. Stripping the bus makes the keychain
          # tests skip deterministically, but the keyring crate's `linux-native`
          # backend needs NO session bus: it falls back to the KERNEL keyring, which
          # a dev box has and this runner does not. `restart_restores_an_enabled_
          # sync_state` guards on `sync_keystore::keyring_available()` (a write
          # probe), so on a box with a kernel keyring it runs and covers the opening
          # of `sync_once`, and here it early-returns. That is worth 39 lines in
          # `sync.rs` — 836 against 797 — not the handful a timing wobble moves.
          # Run 36635754260 read `total lines 85.26% (17636/20685)` where three local
          # runs of the identical tree all read 85.45% (17675/20685), and failed here
          # naming only `src-tauri/src/sync.rs` (-39).
          #
          # CONSEQUENCE: the two `env -u`s above reproduce the no-D-Bus condition, NOT
          # the no-keyring one, so a baseline measured on a dev box is NOT the floor
          # this job enforces — it is ~39 lines too high and will fail here every
          # time. The committed totals (17636 / 30641 / 2112) are THIS job's own
          # measurement, carried into src-tauri/coverage-baseline.json by hand, with
          # each total asserted to equal the sum of the per-file records. Take the
          # floor from a CI run, or from a box where `add_key` genuinely fails —
          # never from a dev box.
          #
          # A second, smaller source of variance was real and is now fixed: four
          # runs of this step on one unchanged tree gave lines
          # 17630/17637/17637/17638, the whole spread being `sync.rs` 830-837 and
          # `adblock_engine.rs` 310-311. The `adblock_engine.rs` half was the
          # test-only warm-up helper busy-looping on a bare `bool` it could not tell
          # from a timeout; asking for a verdict instead made it deterministic (349
          # in three consecutive runs). Run 36626888574 failed here on that. Even
          # with both settled, check the ratchet against several reports
          # before committing a baseline.
          # before committing, or this step becomes a coin flip.
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib --json > "$RUNNER_TEMP/llvmcov.json"
          node scripts/rust-coverage-ratchet.mjs "$RUNNER_TEMP/llvmcov.json"
      - name: cargo audit (BLOCKING — crypto/keyring/TLS surface)
        if: ${{ !cancelled() }}
        # Run from src-tauri/, NOT the repo root: cargo-audit resolves its config as
        # `./.cargo/audit.toml` relative to the CWD and does not search ancestors, so
        # this is what makes src-tauri/.cargo/audit.toml authoritative. The accepted
        # advisories (with their reasons) live in that file now, not in CLI flags.
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Rust gate for the standalone sync-server crate. This is the ONE
  # internet-facing service in the project (axum, reachable by anyone who can
  # reach the deploy host), so it gets the same fmt/clippy/test treatment as the
  # desktop app plus its own dependency audit — previously it had no CI at all,
  # which is how 9 poisonable `.lock().unwrap()` calls on its request hot path
  # survived. It is a separate non-workspace crate, so it needs no webkit2gtk.
  sync-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Same rust-toolchain.toml-driven install as the `rust` job (see the note there),
      # including the explicit pre-install that keeps rustup off its deprecated
      # auto-install path (rust-lang/rustup#4836).
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache: 'false'
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sync-server/target
          key: ci-sync-${{ hashFiles('sync-server/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path sync-server/Cargo.toml
      - name: cargo clippy (-D warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path sync-server/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path sync-server/Cargo.toml
      - name: cargo audit
        if: ${{ !cancelled() }}
        # No `.cargo/audit.toml` in this crate yet, so no accepted advisories; the
        # command runs from sync-server/ anyway so that adding one later is picked up
        # without touching this step.
        working-directory: sync-server
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Compile-only cross-target gate. Every `#[cfg(target_os = ...)]` surface in the
  # core — adblock_win.rs, find_win.rs, nav_url_win.rs, zoom_win.rs, find_mac.rs,
  # nav_url_mac.rs, zoom_mac.rs, and the whole JNI / sync_keystore / ffi_guard block —
  # used to be compiled exclusively on demand, by tauri-build-check.yml, which is
  # workflow_dispatch-only. That is not a theoretical risk here: `webview2-com` is an
  # exact pin but `objc2-web-kit` "0.3", `objc2` "0.6", `webkit2gtk` "2.0",
  # `windows` "0.61` and `jni` "0.21" are all caret ranges, so a single grouped
  # Dependabot cargo PR could break a platform and leave CI green.
  #
  # `cargo check --locked` only — NOT `cargo test` (the unit tests are
  # Linux-cfg/host-shaped and are already run by the `rust` job) and NOT `npm test`.
  # continue-on-error is deliberately OFF. That is the entire point: a new stable
  # clippy lint, or a caret bump, that breaks ONLY the Windows/macOS/Android code must
  # be able to turn CI red, because nothing else in this workflow can see those files.
  # A green run here means "all three platform surfaces still compile", nothing more —
  # it is not a link, bundle, or runtime check (that stays in tauri-build-check.yml).
  cross-target:
    name: cargo check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the GNU cross-check the repo docs already treat as the canonical
          # "does adblock_win/find_win/zoom_win still compile" command
          # (src-tauri/AGENTS.md gotcha 18/20), run here on every PR instead of on
          # demand. `cargo check` does not link, so no NASM/CMake (aws-lc-sys) is
          # needed, but ring's build script DOES compile C for the target even under
          # `cargo check` — the objects it leaves are `x86-64 COFF`, not ELF — so a
          # windows-targeting compiler is genuinely required.
          #
          # That compiler is named EXACTLY below, never as a meta-package. cc-rs maps
          # `x86_64-pc-windows-gnu` to the single tool prefix `x86_64-w64-mingw32`
          # (cc-1.2.64 src/lib.rs), so this leg needs one gcc and one ar for ONE
          # architecture and ONE threading model. The `mingw-w64` meta-package instead
          # pulls four complete cross toolchains — i686 and x86-64, each posix AND
          # win32, each gcc + g++ + binutils — which apt measured on 2026-10-01 at 25
          # packages / 277 MB of archives, against 10 packages / 66.4 MB for the single
          # gcc below. Verified in a real noble container: installing only that package
          # still registers the unversioned alternatives links `x86_64-w64-mingw32-gcc`
          # (auto mode, pointing at the posix variant) and `x86_64-w64-mingw32-ar`, and
          # a compiled object begins `64 86` (COFF AMD64), not `7f 45 4c 46` (ELF).
          # Do NOT widen this back to `mingw-w64`. This leg is ~99% apt by wall time
          # (`cargo check` itself is seconds), so the download size, not the build,
          # decides whether it passes. The runner's throughput to the Ubuntu mirror
          # fell from 3.95 MB/s to 0.13 MB/s within one day (2026-10-01, same mirror,
          # same region), and the byte counts above are what that gets spent on: at
          # 0.13 MB/s the old five-webkit-plus-mingw-w64 list took 45m09s and killed
          # this job; the meta-package's 277 MB alone would land near 34 minutes, and
          # 66.4 MB near 8.
          #
          # This leg used to install the same five webkit/appindicator/rsvg/xdo
          # packages as the `rust` job, on the claim that "tauri-build compiles on the
          # host regardless of the target triple". That is false, and measured: the
          # windows-gnu graph contains ZERO webkit/gtk-family crates (the host graph has
          # 17), tauri-build's build.rs and lib.rs contain no pkg-config/webkit/gtk
          # reference, and a logging pkg-config shim on PATH recorded ZERO invocations
          # across a from-cold check. Do not add them back without re-measuring. If a
          # future bump does reintroduce a pkg-config need, a fast clear build error
          # beats a silent 45-minute hang.
          #
          # Measured job durations for this leg over the last 40 runs (27 of them):
          # everything is 69s-339s except two cancellations on 2026-10-01, and only
          # ONE of those hit the 45-minute budget — run 36906070752, which spent 45m09s
          # inside `apt-get` and was killed by this job's own timeout with `cargo check`
          # left `skipped`. The other (36925658104) was cancelled from outside the
          # workflow at 16m29s, nowhere near the timeout. Both fell in the same
          # mirror-throughput collapse, so treat the byte counts above as the lever
          # and the timeout as the thing that reports it.
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            apt: 'gcc-mingw-w64-x86-64-posix'
          # Android: the JNI/sync_keystore/ffi_guard block. NO apt packages — the NDK
          # clang is already on the runner at ANDROID_NDK_LATEST_HOME (the step below
          # points the build scripts at it), and a from-cold check of this leg also
          # recorded zero pkg-config invocations. It was spending ~15 minutes of apt to
          # install packages nothing queried.
          - target: aarch64-linux-android
            os: ubuntu-latest
            apt: ''
          # macOS: MUST be a macOS runner. objc2's build script needs a macOS C
          # toolchain, so this cannot be cross-compiled from Linux at all
          # (src-tauri/AGENTS.md gotcha 13). x86_64-apple-darwin specifically, because
          # that is the surface the Intel macOS release ships.
          - target: x86_64-apple-darwin
            os: macos-15
            apt: ''
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        # Skip the whole step when a matrix row needs no packages: `apt-get install -y`
        # with an empty list is a no-op, but skipping also skips the `apt-get update`
        # that dominates this step's runtime.
        if: runner.os == 'Linux' && matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      # Same rust-toolchain.toml-driven install as the `rust` job (see the note there),
      # including the explicit pre-install that keeps rustup off its deprecated
      # auto-install path (rust-lang/rustup#4836). The cross target itself is still
      # added by the action below — the pre-install only covers the pinned host toolchain.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: 'false'
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-xcheck-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Point the Android build scripts at the NDK clang
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android21-clang" || {
            echo "::error::No NDK clang at $BIN — is ANDROID_NDK_LATEST_HOME set?"; exit 1; }
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android21-clang"
          } >> "$GITHUB_ENV"
      - name: cargo check
        run: >
          cargo check --locked
          --manifest-path src-tauri/Cargo.toml
          --target ${{ matrix.target }}

  # MSRV gate: prove the `rust-version` in both manifests is a real lower bound rather
  # than an aspiration. The version is read OUT OF THE MANIFESTS, so this job cannot
  # disagree with them, and the two manifests are checked against each other so they
  # cannot drift apart.
  #
  # It has now caught two wrong numbers, which is the whole point of it. 1.80.0 was
  # wrong when the job was written. 1.85.0 was still wrong when it first actually ran,
  # because the steps resolved 1.98.0 through the rust-toolchain.toml directory
  # override (see the `+<msrv>` note below) — once that was fixed the job failed with
  # "rustc 1.85.0 is not supported by the following packages" and the floor moved to
  # 1.88.0, which is what the resolved dependency graph actually requires. A gate that
  # has never gone red has not been tested; do not "fix" a red msrv by loosening this
  # job — re-derive the floor from `cargo metadata` and correct the manifests.
  #
  # `cargo check` rather than clippy/test: the claim under test is "this compiles on the
  # MSRV", not "the MSRV has no lints". Linux-only, because the macOS objc2 stack has a
  # higher floor than the Linux/Windows one; that asymmetry is recorded in the manifests.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - name: Read the declared MSRV
        id: msrv
        shell: bash
        run: |
          APP=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml)
          SYNC=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' sync-server/Cargo.toml)
          if [ -z "$APP" ] || [ -z "$SYNC" ]; then
            echo "::error::A manifest has no rust-version: src-tauri='$APP' sync-server='$SYNC'"
            exit 1
          fi
          if [ "$APP" != "$SYNC" ]; then
            echo "::error::MSRV drift: src-tauri=$APP but sync-server=$SYNC. Keep them equal."
            exit 1
          fi
          echo "MSRV declared by both manifests: $APP"
          echo "version=$APP" >> "$GITHUB_OUTPUT"
      # The one place a toolchain is NOT taken from rust-toolchain.toml: this job
      # deliberately installs the MSRV, not the CI pin. Reading it from the manifest
      # keeps the tested value and the declared value the same number by construction.
      # NOTE: keep `rust-version` three-component (1.88.0, not 1.88). Both manifests
      # declare it that way and it is passed verbatim to `cargo +<version>`, so the
      # argument to cargo and the declared floor are the same string by construction.
      # A bare `1.NN` would be a different string from the one the manifests say.
      #
      # Installing it is NOT enough: a toolchain action sets the rustup DEFAULT, and a
      # default loses to a DIRECTORY OVERRIDE. rust-toolchain.toml sits at the
      # repo root and pins 1.98.0, and these steps run from the repo root, so a plain
      # `cargo check` here resolved 1.98.0 and silently re-checked what the `rust` job
      # already checks — the declared floor was never compiled at all (CI run
      # 36281195902: this job was the only one syncing BOTH 1.85.0 and 1.98.0, and
      # `cargo check (src-tauri)` was the step that reported "syncing channel updates
      # for 1.98.0" → "Compiling app"). The `+toolchain` form below outranks both the
      # override and the default, which is what actually makes this job test the floor.
      #
      # This WAS `dtolnay/rust-toolchain@master`, the only Action in these workflows
      # referenced by a mutable ref: everything else is pinned to a released tag
      # (`actions/checkout@v7`, `actions-rust-lang/setup-rust-toolchain@v1`, …). A
      # third party moving that branch is a supply-chain change to the job that
      # exists to prove the declared floor compiles, and it would arrive as a normal
      # green run. The action is now the same `actions-rust-lang/setup-rust-toolchain`
      # the other Rust jobs already use, with `toolchain:` naming the value read from
      # the manifest — the same explicit-toolchain form the `rust` job's comment
      # describes, so there is one installer to understand instead of two. `cache` is
      # 'false' for the same reason it is there: the explicit actions/cache step below
      # keys on the MSRV, which this action's own cache (keyed on the default
      # toolchain, i.e. 1.98.0) would not.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache: 'false'
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            sync-server/target
          key: ci-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock', 'sync-server/Cargo.lock') }}
      # `+<version>` is load-bearing, not stylistic — see the note on the step above.
      # Echoing `cargo --version` makes the toolchain that actually ran visible in the
      # log, so a future regression here is a one-line read instead of a hunt.
      - name: cargo check (src-tauri)
        run: |
          cargo +${{ steps.msrv.outputs.version }} --version
          cargo +${{ steps.msrv.outputs.version }} check --locked --manifest-path src-tauri/Cargo.toml
      - name: cargo check (sync-server)
        run: |
          cargo +${{ steps.msrv.outputs.version }} --version
          cargo +${{ steps.msrv.outputs.version }} check --locked --manifest-path sync-server/Cargo.toml

name: CI

# Unit-test gate + supply-chain checks. Runs on every PR (so Dependabot's
# grouped update PRs are gated), on every push to `main` (so a direct push —
# not just a PR — is gated by clippy/fmt/tests/audit), weekly (to catch
# dependency-audit drift even without a PR), plus on demand.
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Supersede an in-flight run when a PR branch is re-pushed (e.g. Dependabot
# re-syncing a grouped update) so redundant jobs don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Node gate: type-check (scoped), lint, format, unit tests, supply-chain audit.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (production source, scoped)
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Prettier (format check)
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Unit tests (node + jsdom)
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build renderer (Vite)
        if: ${{ !cancelled() }}
        run: npm run build:renderer
      - name: Check bundle size
        if: ${{ !cancelled() }}
        run: |
          SIZE=$(gzip -c dist/assets/*.js | wc -c)
          THRESHOLD=512000  # 500 KB
          echo "Bundle size: $(($SIZE / 1024)) KB (threshold: $((THRESHOLD / 1024)) KB)"
          if [ "$SIZE" -gt "$THRESHOLD" ]; then
            echo "::warning::Bundle size $(($SIZE / 1024)) KB exceeds $((THRESHOLD / 1024)) KB threshold"
          fi
      - name: Dependency audit gate (high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/check-npm-audit.mjs

  # Rust gate for the src-tauri crate: format, lint, the 119 unit tests, supply-chain audit.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # src-tauri links webkit2gtk on Linux; cargo test/clippy compile the crate, so the
      # native build deps must be present (mirrors tauri-build-check.yml's Linux deps).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ci-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy (-D warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo audit (advisory — crypto/keyring/TLS surface)
        if: ${{ !cancelled() }}
        run: |
          cargo install cargo-audit --locked
          # quick-xml >=0.41 fixes these, but the current Tauri/plist chain pins
          # plist 1.9.0, whose quick-xml constraint is still ^0.39.2.
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

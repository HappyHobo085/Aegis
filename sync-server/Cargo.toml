[package]
name = "aegis-sync-server"
version = "0.1.0"
edition = "2021"
# Mirror the main crate's MSRV (src-tauri = 1.77.2) so clippy lints consistently across the
# repo (e.g. it won't suggest `is_multiple_of`, stabilized in 1.87, over the existing `% 2`).
rust-version = "1.77.2"
description = "Reference self-hosted sync server for Aegis — stores opaque ciphertext only."
publish = false

# Standalone (NOT a workspace member of the Tauri app) so it builds/deploys independently.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the verification half of the auth scheme — the server never signs.
ed25519-dalek = "3"

# Release profile: strip symbols + LTO so the deployed/Docker binary is lean (the plain
# `cargo build --release` was shipping an unstripped ~2.3 MB binary). panic=unwind is kept
# deliberately — this is a server with no JNI/catch_unwind contract, and a panicking request
# handler must fail only its own task, never abort the whole process (panic=abort would).
[profile.release]
strip = true
lto = true
codegen-units = 1

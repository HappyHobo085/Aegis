[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` enables Window::add_child — multiple webviews in one window, which
# is how the browser shell composes a chrome webview + a content webview. The
# feature is API-unstable (not semver-frozen) but production-used; acceptable for
# a personal browser. See tauri PR #8280.
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
adblock = { version = "0.12.5", features = ["content-blocking"] }
tauri-plugin-updater = "2.10.1"
# Sync data-layer (F2a): stable per-record ids for the syncable stores. Already resolved
# transitively (Cargo.lock unchanged but for adding `uuid` to this package's dep list).
uuid = { version = "1", features = ["v4", "serde"] }
# Blocking HTTPS client for fetching filter-list subscriptions. reqwest is already
# in the tree (tauri-plugin-updater pulls it); we just enable the `blocking` API.
# TLS (rustls) comes from the updater's features via cargo feature unification, so
# default-features stay off — avoids pulling native-tls/openssl (not present).
# reqwest is built with `rustls-no-provider` (via tauri-plugin-updater), so every
# TLS client looks up a process-global rustls crypto provider. We install one once
# at startup (see run()), pulling rustls directly for aws-lc-rs::default_provider().
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
rustls = "0.23"

# Sync engine (F2b) crypto. getrandom 0.2 (NOT the 0.4 uuid pulls) for raw OS randomness;
# everything else derives from the BIP39 seed via HKDF. ed25519 keys come from HKDF bytes via
# the infallible SigningKey::from_bytes, so no rand_core is needed.
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
bip39 = "2"
argon2 = "0.5"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

# Linux-only: reach the underlying webkit2gtk widget to work around tauri#10420
# (multiwebview stacks vertically in wry's GtkBox instead of honoring positions).
# Versions match wry 0.55.1's resolved deps so the types are compatible.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# v2_40: the redirect guard's own decide-policy handler needs
# ResponsePolicyDecision::is_main_frame_main_resource() (added in WebKitGTK 2.40) for
# reliable main-frame detection. Requires libwebkit2gtk >= 2.40 at build+runtime (Fedora
# 43 + the ubuntu-24.04 AppImage builder both satisfy this).
webkit2gtk = { version = "2.0", features = ["v2_40"] }
glib = "0.22"
gio = "0.18"

# Android: JNI bridge so the content WebView's shouldInterceptRequest can call the
# Rust `adblock` engine (adblock_engine.rs). 0.21 matches wry/tao's resolved jni.
[target.'cfg(target_os = "android")'.dependencies]
# Reach the JVM from Rust so sync_keystore can up-call the Kotlin AegisKeystore to wrap/unwrap
# the sync seed with the hardware AndroidKeyStore. The JavaVM is captured in JNI_OnLoad — Tauri
# doesn't use ndk-glue, so ndk_context is never initialized (see sync_keystore.rs).
jni = "0.21"

# Windows: add our own WebView2 WebResourceRequested handler (full network ad-block)
# directly on the content webview's ICoreWebView2 reached via Tauri's with_webview —
# wry only intercepts custom-protocol requests. webview2-com pinned to match tauri's
# PlatformWebview types; windows for PWSTR/HSTRING/EventRegistrationToken.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_WinRT"] }

# macOS: observe the WKWebView's `URL` via KVO (nav_url_mac.rs) so the address bar
# tracks same-document History-API/hash navigations that wry's WKNavigationDelegate
# callbacks don't report — the WKWebView analog of Linux's notify::uri. Versions match
# tauri/wry's resolved objc2 so PlatformWebview::inner() casts to the same WKWebView.
# WKFindConfiguration + WKFindResult + block2: required for find_mac.rs
# (WKWebView::findString:withConfiguration:completionHandler:). These features are off
# by default in objc2-web-kit 0.3; block2 enables the optional block2 dep so the method
# binding is compiled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKFindConfiguration", "WKFindResult", "block2", "objc2-core-foundation"] }

# OS keychain for the sync seed at rest (desktop only — keyring 3.x has NO Android backend;
# Android wraps the seed via the hardware Keystore through JNI). When no secret-service
# daemon is present (headless/CI) the vault falls back to a passphrase-wrapped file.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "windows-native", "apple-native"] }

[dev-dependencies]
# Enables tauri::test::mock_app / mock_builder / mock_context (the crate's `test`
# feature) so AppHandle-backed dispatchers can be unit-tested. Dev-only: release
# builds never pull the test runtime. Version must match the normal `tauri` dep.
tauri = { version = "2.11.2", features = ["test"] }

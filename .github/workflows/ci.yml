name: CI

# Unit-test gate + supply-chain checks. Runs on every PR (so Dependabot's
# grouped update PRs are gated), on push to main, and weekly (to catch
# dependency-audit drift even without a PR).
on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Supersede an in-flight run when a PR branch is re-pushed (e.g. Dependabot
# re-syncing a grouped update) so redundant jobs don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (node + jsdom)
        run: npm test
      - name: Dependency audit gate (high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/check-npm-audit.mjs

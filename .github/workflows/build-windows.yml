name: Build Windows

# Builds the Windows installer (.exe) on a real Windows runner. This is required
# because Aegis depends on better-sqlite3 — a native C++ addon that must be
# compiled for Windows against Electron 42's ABI (146). No prebuilt binary exists
# for that combination, and it cannot be reliably cross-compiled from Linux.
#
# Runs automatically on every push to main, and can also be started manually
# from the Actions tab (or `gh workflow run build-windows.yml`). The resulting
# .exe is uploaded as a build artifact — nothing is published to GitHub Releases
# (--publish never). Tagged releases (v*) are built and published by release.yml.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main + rebuild native module for Electron
        run: npm run build

      - name: Package Windows installer + portable exe
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aegis-windows-exe
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
